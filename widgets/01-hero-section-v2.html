<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

<style>
.hero-wrapper {
  --navy: #0d1f3c;
  --blue: #1a56db;
  --blue-light: #3b82f6;
  --white: #ffffff;
  --off-white: #f8f9fc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-900: #0f172a;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif: 'Playfair Display', Georgia, serif;
  --transition: .3s cubic-bezier(.4,0,.2,1);
  --transition-slow: .6s cubic-bezier(.4,0,.2,1);
}

.hero-wrapper * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.hero-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 2.5rem 2rem 0;
  position: relative;
  background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
  overflow: hidden;
}

/* Animated background elements */
.hero-wrapper::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
  border-radius: 50%;
  animation: float 8s ease-in-out infinite;
  z-index: 0;
}

.hero-wrapper::after {
  content: '';
  position: absolute;
  bottom: -30%;
  left: -5%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(26, 86, 219, 0.06) 0%, transparent 70%);
  border-radius: 50%;
  animation: float 10s ease-in-out infinite reverse;
  z-index: 0;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(30px); }
}

.hero-container {
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: center;
  position: relative;
  z-index: 1;
}

/* LEFT CONTENT */
.hero-content {
  max-width: 560px;
  animation: slideInLeft 0.8s ease-out forwards;
}

@keyframes slideInLeft {
  from {
    opacity: 0;
    transform: translateX(-60px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: .85rem;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 1.8rem;
  animation: slideInLeft 0.8s ease-out 0.1s forwards;
  opacity: 0;
}

.eyebrow-line {
  width: 2rem;
  height: 1.5px;
  background: var(--blue);
  flex-shrink: 0;
  animation: expandWidth 0.8s ease-out 0.2s forwards;
  transform-origin: left;
  opacity: 0;
}

@keyframes expandWidth {
  from {
    width: 0;
    opacity: 0;
  }
  to {
    width: 2rem;
    opacity: 1;
  }
}

.hero-title {
  font-family: var(--font-serif);
  font-size: clamp(2.4rem, 4.2vw, 4.2rem);
  font-weight: 700;
  line-height: 1.05;
  color: var(--slate-900);
  margin-bottom: 1.5rem;
  letter-spacing: -.02em;
  animation: slideInLeft 0.8s ease-out 0.2s forwards;
  opacity: 0;
}

.hero-title em {
  font-style: italic;
  color: #1e3a68;
  position: relative;
}

.hero-title em::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, var(--blue) 0%, var(--blue-light) 100%);
  border-radius: 2px;
  animation: scaleX 0.8s ease-out 0.5s forwards;
  transform-origin: left;
  opacity: 0;
}

@keyframes scaleX {
  from {
    transform: scaleX(0);
    opacity: 0;
  }
  to {
    transform: scaleX(1);
    opacity: 1;
  }
}

.hero-subtitle {
  font-size: 1rem;
  color: var(--slate-500);
  font-weight: 400;
  line-height: 1.75;
  max-width: 420px;
  margin-bottom: 2.5rem;
  animation: slideInLeft 0.8s ease-out 0.3s forwards;
  opacity: 0;
}

.hero-subtitle strong {
  color: var(--slate-800);
  font-weight: 600;
}

.hero-ctas {
  display: flex;
  gap: 1rem;
  align-items: center;
  animation: slideInLeft 0.8s ease-out 0.4s forwards;
  opacity: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .6rem;
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: .95rem 2.2rem;
  border-radius: 4px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  white-space: nowrap;
  font-family: var(--font-sans);
  border: none;
  cursor: pointer;
  text-decoration: none;
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.3) 0%, transparent 70%);
  opacity: 0;
}

.btn:hover::before {
  animation: pulse 0.6s ease-out;
}

@keyframes pulse {
  0% {
    opacity: 1;
    transform: scale(0);
  }
  100% {
    opacity: 0;
    transform: scale(1);
  }
}

.btn-primary {
  background: var(--navy);
  color: #fff;
  box-shadow: 0 4px 20px rgba(13, 31, 60, .25);
}

.btn-primary:hover {
  background: var(--blue);
  box-shadow: 0 8px 32px rgba(26, 86, 219, .35);
  transform: translateY(-2px);
}

.btn-outline {
  background: transparent;
  color: var(--slate-700);
  border: 1.5px solid var(--slate-300);
}

.btn-outline:hover {
  border-color: var(--navy);
  color: var(--navy);
  background: var(--slate-50);
  transform: translateY(-2px);
}

/* RIGHT IMAGE */
.hero-image {
  position: relative;
  display: flex;
  justify-content: flex-end;
  animation: slideInRight 0.8s ease-out forwards;
}

@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translateX(60px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.hero-photo-wrap {
  position: relative;
  width: 100%;
  max-width: 520px;
  min-height: 540px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.hero-photo {
  width: auto;
  height: auto;
  max-width: 140%;
  max-height: 85vh;
  object-fit: contain;
  margin-bottom: -6rem;
  z-index: 1;
  animation: slideInUp 0.8s ease-out 0.2s forwards;
  opacity: 0;
  filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.1));
}

@keyframes slideInUp {
  from {
    opacity: 0;
    transform: translateY(60px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-photo:hover {
  animation: floatImage 3s ease-in-out infinite;
}

@keyframes floatImage {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-15px);
  }
}

.hero-stats-badge {
  position: absolute;
  bottom: 3rem;
  right: -2rem;
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(16px);
  border: 1px solid var(--slate-200);
  border-radius: 4px;
  box-shadow: 0 8px 32px rgba(13, 31, 60, .1);
  display: flex;
  align-items: center;
  padding: 1rem 1.6rem;
  z-index: 10;
  animation: bounceInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
  opacity: 0;
}

@keyframes bounceInUp {
  0% {
    opacity: 0;
    transform: translateY(40px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-stats-badge:hover {
  box-shadow: 0 12px 48px rgba(13, 31, 60, .15);
  transform: translateY(-4px);
}

.badge-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 1.2rem;
  text-align: center;
}

.badge-num {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--navy);
  line-height: 1;
  display: inline-flex;
  align-items: baseline;
  gap: .05em;
  font-family: var(--font-serif);
}

.badge-label {
  display: block;
  font-size: .58rem;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--slate-400);
  margin-top: .35rem;
  font-family: var(--font-sans);
}

.badge-divider {
  width: 1px;
  height: 2.2rem;
  background: var(--slate-200);
}

/* RESPONSIVE */
@media (max-width: 1024px) {
  .hero-container {
    grid-template-columns: 1fr;
  }

  .hero-image {
    max-width: 480px;
    margin: 0 auto;
    justify-content: center;
  }

  .hero-photo-wrap {
    min-height: 440px;
  }

  .hero-photo {
    max-width: 100%;
    margin-bottom: 0;
  }

  .hero-stats-badge {
    position: static;
    margin-top: 2rem;
    justify-content: center;
  }
}

@media (max-width: 768px) {
  .hero-wrapper {
    padding: 4rem 1.5rem 3rem;
    min-height: auto;
  }

  .hero-title {
    font-size: 2.5rem;
  }

  .hero-ctas {
    flex-direction: column;
    align-items: stretch;
  }

  .btn {
    width: 100%;
  }

  .hero-photo {
    max-height: 50vh;
  }
}

@media (max-width: 480px) {
  .hero-wrapper {
    padding: 4rem 1.2rem 3rem;
  }

  .hero-title {
    font-size: 2rem;
  }

  .hero-container {
    gap: 2rem;
  }
}
</style>

<div class="hero-wrapper">
  <div class="hero-container">
    <!-- LEFT CONTENT -->
    <div class="hero-content">
      <div class="eyebrow">
        <span class="eyebrow-line"></span>
        Referente Nacional
      </div>
      <h1 class="hero-title">Rigor de <em>peritación</em><br>al servicio de la justicia.</h1>
      <p class="hero-subtitle">Director de la <strong>Escuela Nacional de Peritos</strong>, Perito de Automoción e impulsor de la <strong>Comunidad Pericial</strong>.</p>
      <div class="hero-ctas">
        <a href="#contacto" class="btn btn-primary">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
        <a href="https://www.escuelanacionaldeperitos.com/" target="_blank" rel="noopener" class="btn btn-outline">Acceso Escuela</a>

    <!-- RIGHT IMAGE -->
    <div class="hero-image">
      <div class="hero-photo-wrap">
        <img src="https://romanalvarezperito.com/wp-content/uploads/2026/03/Roman-Alvarez-Vijande-Perito-Judicial-de-Automoviles-1-scaled.png" class="hero-photo" alt="Román Álvarez Vijande — Perito Judicial de Automóviles" loading="eager">

        <!-- Stats Badge -->
        <div class="hero-stats-badge">

      </div>
    </div>
  </div>
</div>

<script>
// Mouse tracking for ripple effect on buttons
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('mousemove', (e) => {
    const rect = btn.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / btn.offsetWidth) * 100;
    const y = ((e.clientY - rect.top) / btn.offsetHeight) * 100;
    btn.style.setProperty('--x', x + '%');
    btn.style.setProperty('--y', y + '%');
  });
});
</script>
