<!-- HERO SECTION - ROMANA ÁLVAREZ -->
<style>
  :root {
    --primary-dark: #0d1f3c;
    --primary-blue: #1a56db;
    --light-blue: #3b82f6;
    --white: #ffffff;
    --bg-light: #f8f9fc;
    --text-dark: #1f2937;
    --text-light: #6b7280;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .hero-container {
    background: linear-gradient(135deg, var(--primary-dark) 0%, #1a2d52 100%);
    color: var(--white);
    padding: 80px 40px;
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .hero-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 20% 50%, rgba(26, 86, 219, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .hero-content {
    max-width: 1200px;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .hero-text {
    animation: slideInLeft 0.8s ease-out;
  }

  .hero-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 5vw, 3.5rem);
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 24px;
    letter-spacing: -0.02em;
  }

  .hero-text .tagline {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 2vw, 1.25rem);
    font-weight: 500;
    color: var(--light-blue);
    margin-bottom: 32px;
    letter-spacing: 0.05em;
  }

  .hero-text p {
    font-family: 'Inter', sans-serif;
    font-size: clamp(0.95rem, 1.5vw, 1.125rem);
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 40px;
    max-width: 500px;
  }

  .hero-cta {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Inter', sans-serif;
    padding: 14px 32px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
  }

  .btn-primary {
    background: var(--light-blue);
    color: var(--white);
  }

  .btn-primary:hover {
    background: var(--primary-blue);
    transform: translateY(-2px);
    box-shadow: 0 20px 40px rgba(26, 86, 219, 0.3);
  }

  .btn-secondary {
    background: transparent;
    color: var(--white);
    border: 2px solid var(--light-blue);
  }

  .btn-secondary:hover {
    background: var(--light-blue);
    color: var(--primary-dark);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin-top: 50px;
  }

  .stat-item {
    border-top: 2px solid rgba(255, 255, 255, 0.2);
    padding-top: 20px;
    animation: slideInUp 0.8s ease-out 0.3s backwards;
  }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 2.5rem);
    font-weight: 700;
    color: var(--light-blue);
    margin-bottom: 8px;
  }

  .stat-label {
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 0.05em;
  }

  .hero-image {
    position: relative;
    animation: slideInRight 0.8s ease-out;
  }

  .hero-image img {
    width: 100%;
    height: auto;
    border-radius: 16px;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
    display: block;
  }

  .image-badge {
    position: absolute;
    background: var(--light-blue);
    color: var(--white);
    padding: 12px 20px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    bottom: 30px;
    left: 30px;
    box-shadow: 0 20px 40px rgba(26, 86, 219, 0.3);
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes slideInLeft {
    from {
      opacity: 0;
      transform: translateX(-50px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes slideInRight {
    from {
      opacity: 0;
      transform: translateX(50px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes slideInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes bounce {
    0%, 100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-10px);
    }
  }

  @media (max-width: 768px) {
    .hero-container {
      padding: 60px 20px;
      min-height: auto;
    }

    .hero-content {
      grid-template-columns: 1fr;
      gap: 40px;
    }

    .hero-text h1 {
      font-size: 2rem;
    }

    .hero-cta {
      flex-direction: column;
    }

    .btn {
      width: 100%;
      text-align: center;
    }

    .hero-stats {
      grid-template-columns: 1fr;
      gap: 30px;
    }
  }
</style>

<div class="hero-container">
  <div class="hero-content">
    <div class="hero-text">
      <h1>Rigor de peritación al servicio de la justicia</h1>
      <p class="tagline">La evidencia no miente</p>
      <p>Director de la Escuela Nacional de Peritos, Perito de Automoción e impulsor de la Comunidad Pericial</p>
      <div class="hero-cta">
        <a href="#contacto" class="btn btn-primary">Solicitar Peritación</a>
        <a href="#servicios" class="btn btn-secondary">Conocer Más</a>
      </div>

      <div class="hero-stats">
        <div class="stat-item">
          <div class="stat-number">25+</div>
          <div class="stat-label">AÑOS EXPERIENCIA</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">5000+</div>
          <div class="stat-label">PERITACIONES</div>
        </div>
      </div>
    </div>

    <div class="hero-image">
      <img src="https://via.placeholder.com/500x600/0d1f3c/ffffff?text=Romana+Alvarez" alt="Romana Álvarez Perito">
      <div class="image-badge">Experto Certificado</div>
    </div>
  </div>
</div>
