<!-- ════════════════════════════════════════════════════════════════════════════════════
  CONTACTO - Contact Form Section
  Complete form with validation, animations, and feedback messages
  ════════════════════════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
.contacto-wrapper {
  --navy: #0d1f3c;
  --blue: #1a56db;
  --blue-light: #3b82f6;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-500: #64748b;
  --slate-700: #334155;
  --slate-900: #0f172a;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif: 'Playfair Display', Georgia, serif;
  --transition: .3s cubic-bezier(.4,0,.2,1);
}

.contacto-wrapper * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.contacto-wrapper {
  padding: 3.5rem 2rem;
  background: linear-gradient(180deg, #ffffff 0%, var(--slate-100) 100%);
  position: relative;
  overflow: hidden;
}

/* Background elements */
.contacto-wrapper::before {
  content: '';
  position: absolute;
  top: -30%;
  right: -20%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
  border-radius: 50%;
  animation: float 15s ease-in-out infinite;
  z-index: 0;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(30px); }
}

.section-container {
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.contacto-grid {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 4rem;
  align-items: start;
}

/* LEFT SECTION */
.contacto-left {
  animation: slideInLeft 0.8s ease-out;
}

@keyframes slideInLeft {
  from {
    opacity: 0;
    transform: translateX(-40px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.section-tag {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 1.2rem;
}

.section-tag::before {
  content: '';
  display: inline-block;
  width: 2rem;
  height: 1.5px;
  background: var(--blue);
}

.section-title {
  font-size: clamp(2rem, 4vw, 3rem);
  font-family: var(--font-serif);
  font-weight: 700;
  line-height: 1.15;
  color: var(--slate-900);
  margin-bottom: 1.2rem;
}

.section-title em {
  font-style: italic;
  color: #1e3a68;
}

.section-subtitle {
  font-size: 1.05rem;
  color: var(--slate-500);
  font-weight: 300;
  line-height: 1.75;
  margin-bottom: 2rem;
}

.contact-info {
  margin-top: 2rem;
}

.info-item {
  font-size: .95rem;
  color: var(--slate-600);
  margin-bottom: .5rem;
  display: flex;
  align-items: center;
  gap: .6rem;
  transition: all var(--transition);
}

.info-item:hover {
  color: var(--blue);
  transform: translateX(4px);
}

.info-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  transition: all var(--transition);
}

.info-item:hover svg {
  transform: rotate(10deg);
}

.info-location {
  font-size: .85rem;
  color: #1e3a68;
  font-weight: 700;
  margin-top: 1rem;
  letter-spacing: .05em;
}

/* RIGHT SECTION - FORM */
.contacto-right {
  animation: slideInRight 0.8s ease-out;
}

@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translateX(40px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.contacto-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: .4rem;
  animation: fadeInUp 0.8s ease-out forwards;
  opacity: 0;
}

.form-group:nth-child(1) { animation-delay: 0.1s; }
.form-group:nth-child(2) { animation-delay: 0.2s; }
.form-group:nth-child(3) { animation-delay: 0.3s; }
.form-group:nth-child(4) { animation-delay: 0.4s; }
.form-group:nth-child(5) { animation-delay: 0.5s; }
.form-group:nth-child(6) { animation-delay: 0.6s; }

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.form-group label {
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--slate-700);
  font-family: var(--font-sans);
  transition: color var(--transition);
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: .8rem 1rem;
  border: 1.5px solid var(--slate-200);
  border-radius: 4px;
  font-size: .85rem;
  color: var(--slate-900);
  background: #fff;
  transition: all var(--transition);
  outline: none;
  font-family: var(--font-sans);
}

.form-group input::placeholder,
.form-group select::placeholder,
.form-group textarea::placeholder {
  color: var(--slate-500);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(26, 86, 219, .1);
  background: linear-gradient(135deg, #ffffff 0%, rgba(59, 130, 246, 0.02) 100%);
}

.form-group input:focus + label,
.form-group select:focus + label,
.form-group textarea:focus + label {
  color: var(--blue);
}

.form-group textarea {
  resize: vertical;
  min-height: 90px;
}

.form-check {
  display: flex;
  align-items: flex-start;
  gap: .75rem;
  animation: fadeInUp 0.8s ease-out 0.7s forwards;
  opacity: 0;
}

.form-check input[type="checkbox"] {
  width: 14px;
  height: 14px;
  margin-top: 2px;
  accent-color: var(--blue);
  flex-shrink: 0;
  cursor: pointer;
  transition: all var(--transition);
}

.form-check input[type="checkbox"]:hover {
  transform: scale(1.15);
}

.form-check label {
  font-size: .75rem;
  color: var(--slate-500);
  line-height: 1.4;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: color var(--transition);
}

.form-check label:hover {
  color: var(--slate-900);
}

.form-check label a {
  color: var(--blue);
  text-decoration: underline;
  transition: color var(--transition);
}

.form-check label a:hover {
  color: #0d1f3c;
  text-decoration-color: transparent;
}

.submit-btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: .6rem;
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: .95rem 2.2rem;
  border-radius: 4px;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  font-family: var(--font-sans);
  background: var(--navy);
  color: #fff;
  box-shadow: 0 4px 20px rgba(13, 31, 60, .25);
  border: none;
  cursor: pointer;
  margin-top: .5rem;
  width: 100%;
  animation: fadeInUp 0.8s ease-out 0.8s forwards;
  opacity: 0;
}

.submit-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.3) 0%, transparent 70%);
  opacity: 0;
}

.submit-btn:hover::before {
  animation: pulse 0.6s ease-out;
}

@keyframes pulse {
  0% {
    opacity: 1;
    transform: scale(0);
  }
  100% {
    opacity: 0;
    transform: scale(1);
  }
}

.submit-btn:hover {
  background: var(--blue);
  box-shadow: 0 8px 32px rgba(26, 86, 219, .35);
  transform: translateY(-2px);
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* FEEDBACK MESSAGE */
.form-message {
  padding: 1rem 1.2rem;
  border-radius: 4px;
  font-size: .88rem;
  font-weight: 500;
  margin-top: .5rem;
  animation: slideInDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  align-items: center;
  gap: .6rem;
}

@keyframes slideInDown {
  from {
    opacity: 0;
    transform: translateY(-15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.form-message.success {
  background: #f0fdf4;
  border: 1px solid #86efac;
  color: #166534;
}

.form-message.error {
  background: #fef2f2;
  border: 1px solid #fca5a5;
  color: #991b1b;
}

.form-message svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* RESPONSIVE */
@media (max-width: 1024px) {
  .contacto-grid {
    grid-template-columns: 1fr;
    gap: 3rem;
  }
}

@media (max-width: 768px) {
  .contacto-wrapper {
    padding: 3rem 1.5rem;
  }

  .section-title {
    font-size: 2rem;
  }

  .contacto-grid {
    gap: 2.5rem;
  }
}

@media (max-width: 480px) {
  .contacto-wrapper {
    padding: 2.5rem 1.2rem;
  }

  .section-container {
    padding: 0;
  }

  .form-group {
    gap: .3rem;
  }

  .submit-btn {
    padding: .8rem 1.5rem;
    font-size: .72rem;
  }
}
</style>

<div class="contacto-wrapper">
  <div class="section-container">
    <div class="contacto-grid">
      <!-- LEFT INFO -->
      <div class="contacto-left">
        <div class="section-tag">Contacto</div>
        <h2 class="section-title">¿Necesitas una<br><em>peritación</em>?</h2>
        <p class="section-subtitle">Cuéntame tu caso y te respondo en menos de 24 horas con una primera valoración sin compromiso.</p>

        <div class="contact-info">
          <div class="info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            roman@romanalvarezperito.com
          </div>
          <p class="info-location">Asturias · Tenerife · Barcelona · Valencia · Madrid</p>
        </div>
      </div>

      <!-- RIGHT FORM -->
      <div class="contacto-right">
        <form class="contacto-form" id="contactForm">
          <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" required>
          </div>

          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+34 600 000 000">
          </div>

          <div class="form-group">
            <label for="servicio">Tipo de Servicio</label>
            <select id="servicio" name="servicio">
              <option value="">Selecciona un servicio</option>
              <option value="accidente">Accidente de Tráfico</option>
              <option value="defectos">Defectos Ocultos</option>
              <option value="tasacion">Tasación Oficial</option>
              <option value="ratificacion">Ratificación Judicial</option>
              <option value="digital">Peritación Digital</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="mensaje">Describe tu Caso</label>
            <textarea id="mensaje" name="mensaje" rows="4" placeholder="Cuéntame brevemente tu situación..." required></textarea>
          </div>

          <div class="form-check">
            <input type="checkbox" id="privacidad" name="privacidad" required>
            <label for="privacidad">Acepto la <a href="/politica-de-privacidad" target="_blank">Política de Privacidad</a> y el tratamiento de mis datos.</label>
          </div>

          <button type="submit" class="submit-btn">
            Enviar Consulta
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
// Mouse tracking for ripple effect on submit button
const submitBtn = document.querySelector('.submit-btn');
if (submitBtn) {
  submitBtn.addEventListener('mousemove', (e) => {
    const rect = submitBtn.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / submitBtn.offsetWidth) * 100;
    const y = ((e.clientY - rect.top) / submitBtn.offsetHeight) * 100;
    submitBtn.style.setProperty('--x', x + '%');
    submitBtn.style.setProperty('--y', y + '%');
  });
}

// Form handling
const contactForm = document.getElementById('contactForm');
if (contactForm) {
  contactForm.addEventListener('submit', function(e) {
    e.preventDefault();

    const nombre = document.getElementById('nombre').value.trim();
    const email = document.getElementById('email').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const servicio = document.getElementById('servicio').value;
    const mensaje = document.getElementById('mensaje').value.trim();
    const privacidad = document.getElementById('privacidad').checked;

    // Validation
    if (!nombre || !email || !mensaje || !privacidad) {
      showMessage('Por favor, rellena todos los campos obligatorios.', 'error');
      return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      showMessage('Introduce un correo válido.', 'error');
      return;
    }

    // Submit
    const submitBtn = contactForm.querySelector('.submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    setTimeout(() => {
      showMessage('¡Consulta enviada! Te responderemos en menos de 24h.', 'success');
      contactForm.reset();
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Enviar Consulta <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    }, 1200);
  });

  function showMessage(msg, type) {
    const existing = document.getElementById('formMsg');
    if (existing) existing.remove();

    const msgEl = document.createElement('div');
    msgEl.id = 'formMsg';
    msgEl.className = `form-message ${type}`;
    msgEl.setAttribute('role', 'alert');

    const icon = type === 'success'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';

    msgEl.innerHTML = icon + '<span>' + msg + '</span>';
    contactForm.appendChild(msgEl);
    msgEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    setTimeout(() => {
      if (msgEl.parentNode) msgEl.remove();
    }, 6000);
  }
}
</script>
