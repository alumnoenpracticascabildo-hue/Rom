<!-- STATS COUNTER SECTION - ROMANA ÁLVAREZ -->
<style>
  :root {
    --primary-dark: #0d1f3c;
    --primary-blue: #1a56db;
    --light-blue: #3b82f6;
    --white: #ffffff;
    --bg-light: #f8f9fc;
    --text-dark: #1f2937;
    --text-light: #6b7280;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .stats-section {
    padding: 100px 40px;
    background: var(--white);
    position: relative;
    overflow: hidden;
  }

  .stats-container {
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
  }

  .stats-header {
    text-align: center;
    margin-bottom: 80px;
    animation: fadeIn 0.8s ease-out;
  }

  .stats-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 2.8rem);
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 24px;
    letter-spacing: -0.02em;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 60px;
  }

  .stat-card {
    text-align: center;
    position: relative;
    animation: slideInUp 0.6s ease-out both;
  }

  .stat-card:nth-child(1) { animation-delay: 0.1s; }
  .stat-card:nth-child(2) { animation-delay: 0.2s; }
  .stat-card:nth-child(3) { animation-delay: 0.3s; }
  .stat-card:nth-child(4) { animation-delay: 0.4s; }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 8vw, 4rem);
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary-blue), var(--light-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    line-height: 1;
  }

  .stat-value {
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .stat-description {
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    color: var(--text-dark);
    line-height: 1.6;
  }

  .stat-separator {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, var(--primary-blue), var(--light-blue));
    margin: 20px auto 0;
    border-radius: 2px;
    opacity: 0;
    animation: slideInDown 0.6s ease-out 0.3s forwards;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @keyframes slideInUp {
    from {
      opacity: 0;
      transform: translateY(40px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes slideInDown {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 768px) {
    .stats-section {
      padding: 60px 20px;
    }

    .stats-header {
      margin-bottom: 60px;
    }

    .stats-grid {
      gap: 40px;
    }

    .stat-number {
      font-size: 2.5rem;
    }
  }
</style>

<div class="stats-section">
  <div class="stats-container">
    <div class="stats-header">
      <h2>Números que Hablan por Sí Solos</h2>
    </div>

    <div class="stats-grid">
      <!-- Stat 1 -->
      <div class="stat-card">
        <div class="stat-number" data-target="5000">5000</div>
        <div class="stat-separator"></div>
        <div class="stat-value">Peritaciones</div>
        <div class="stat-description">Casos resueltos con máximo profesionalismo</div>
      </div>

      <!-- Stat 2 -->
      <div class="stat-card">
        <div class="stat-number" data-target="25">25</div>
        <div class="stat-separator"></div>
        <div class="stat-value">Años Experiencia</div>
        <div class="stat-description">Trayectoria profesional reconocida</div>
      </div>

      <!-- Stat 3 -->
      <div class="stat-card">
        <div class="stat-number" data-target="98">98%</div>
        <div class="stat-separator"></div>
        <div class="stat-value">Satisfacción</div>
        <div class="stat-description">Clientes completamente satisfechos</div>
      </div>

      <!-- Stat 4 -->
      <div class="stat-card">
        <div class="stat-number" data-target="30">30</div>
        <div class="stat-separator"></div>
        <div class="stat-value">Comunidades</div>
        <div class="stat-description">Presencia en toda España</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Contador animado
  const observerOptions = {
    threshold: 0.5,
    rootMargin: '0px'
  };

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && !entry.target.hasAttribute('data-animated')) {
        entry.target.setAttribute('data-animated', 'true');
        animateCounter(entry.target);
      }
    });
  }, observerOptions);

  function animateCounter(element) {
    const statNumber = element.querySelector('.stat-number');
    const target = parseInt(statNumber.getAttribute('data-target'));
    const duration = 2000;
    const increment = target / (duration / 16);
    let current = 0;

    const interval = setInterval(() => {
      current += increment;
      if (current >= target) {
        statNumber.textContent = statNumber.getAttribute('data-target');
        clearInterval(interval);
      } else {
        statNumber.textContent = Math.floor(current);
      }
    }, 16);
  }

  // Observar todos los stat-cards
  document.querySelectorAll('.stat-card').forEach(card => {
    observer.observe(card);
  });
</script>
